<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
		<title>Idle World Wiki</title>
		<meta name="description" content="アイドルRPGのワールド定義から機械生成した wiki" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/sidebar-folder.min.css" />
		<link rel="stylesheet" href="assets/wiki.css" />
	</head>
	<body>
		<div id="app"></div>
		<!-- 生成物: ワールド名・言語・配色（npm run wiki-generate が書く） -->
		<script src="assets/config.js"></script>
		<script>
			(function () {
				var config = window.WIKI_CONFIG;
				// ルート（#/）は既定言語のトップへ送る
				if (!location.hash || location.hash === "#/" || location.hash === "#") location.replace("#/" + config.languages[0] + "/");
				document.title = config.name;
				var alias = {};
				config.languages.forEach(function (language) {
					// サイドバー・ナビバーは言語ごとに1枚。配下のどのページからも同じものを引く
					alias["/" + language + "/.*/_sidebar.md"] = "/" + language + "/_sidebar.md";
					alias["/" + language + "/.*/_navbar.md"] = "/" + language + "/_navbar.md";
				});
				window.$docsify = {
					name: config.name,
					nameLink: { "/": "#/" + config.languages[0] + "/" },
					loadSidebar: true,
					loadNavbar: true,
					alias: alias,
					subMaxLevel: 0,
					maxLevel: 3,
					auto2top: true,
					notFoundPage: true,
					themeColor: config.themeColor,
					sidebarDisplayLevel: 0,
					externalLinkTarget: "_blank",
				};
			})();
		</script>
		<script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/docsify-sidebar-collapse.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
		<script src="assets/wiki.js"></script>
	</body>
</html>
